<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1315" />
      <stop offset="100%" stop-color="#050607" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75f5d0" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Subtle Grid Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface with Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Inner Tech Corner Markers -->
  <path d="M 64 104 L 64 64 L 104 64" fill="none" stroke="#5eead4" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round" />
  <path d="M 448 408 L 448 448 L 408 448" fill="none" stroke="#5eead4" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round" />

  <!-- Glowing Geometric Monogram "T" -->
  <g filter="url(#cyanGlow)">
    <!-- Top Horizontal Bar -->
    <path 
      d="M 120 144 L 392 144 C 404 144 414 154 414 166 L 414 196 C 414 208 404 218 392 218 L 296 218 L 296 364 C 296 376 286 386 274 386 L 238 386 C 226 386 216 376 216 364 L 216 218 L 120 218 C 108 218 98 208 98 196 L 98 166 C 98 154 108 144 120 144 Z" 
      fill="url(#neonCyan)" 
    />
    <!-- Tech Accent Dot (Energy Node) -->
    <circle cx="396" cy="116" r="14" fill="#75f5d0" />
  </g>
</svg>
